<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120d1c">
<title>Duck Tattoo – Ink Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background:#07040c; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; }
  /* ocupa exatamente a área visível (no celular a barra do navegador come parte da altura) */
  body { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing:border-box; }
  #tela { width:min(100vw, calc(100dvh * 16 / 9)); aspect-ratio:16 / 9; image-rendering:pixelated; display:block; background:#120d1c; flex:none; }
  #girar { display:none; position:fixed; inset:0; background:#120d1c; color:#e0a826; font-family:'Press Start 2P', monospace;
    font-size:14px; line-height:1.8; text-align:center; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; z-index:2; }
  @media (orientation: portrait) and (max-width: 820px) and (pointer: coarse) { #girar { display:flex; } }
</style>
</head>
<body>
<canvas id="tela" width="960" height="540"></canvas>
<div id="girar">GIRE O CELULAR<br>PARA JOGAR DEITADO</div>
<script>
  // Ajusta o jogo ao espaço realmente visível (descontando barra do navegador e entalhe da tela)
  (function () {
    const tela = document.getElementById('tela');
    function ajustar() {
      const vv = window.visualViewport;
      const cs = getComputedStyle(document.body);
      const larg = (vv ? vv.width : innerWidth) - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const alt = (vv ? vv.height : innerHeight) - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const escala = Math.max(0.1, Math.min(larg / 960, alt / 540));
      tela.style.width = Math.floor(960 * escala) + 'px';
      tela.style.height = Math.floor(540 * escala) + 'px';
    }
    addEventListener('resize', ajustar);
    addEventListener('orientationchange', () => setTimeout(ajustar, 250));
    if (window.visualViewport) visualViewport.addEventListener('resize', ajustar);
    document.addEventListener('fullscreenchange', () => setTimeout(ajustar, 100));
    ajustar();
  })();
</script>
<script>
  // Carrega os scripts sempre na versão mais nova (evita o navegador usar cópia antiga guardada em cache)
  (function () {
    const v = '?v=202611251624';
    ['../ferramentas/sprites.js', '../sons/sons.js', 'js/qrcode.min.js', 'js/base.js', 'js/heroi.js', 'js/inimigos.js',
      'js/porta.js', 'js/cartucho.js', 'js/nivel.js', 'js/chefe.js', 'js/chefe2.js', 'js/chefe3.js', 'js/chefe4.js', 'js/chefe5.js', 'js/minijogo.js', 'js/decalque.js', 'js/corrida.js', 'js/chuva.js', 'js/lendaria.js',
      'js/interface.js', 'js/cupom.js', 'js/principal.js'
    ].forEach(src => {
      const s = document.createElement('script');
      s.src = src + v; s.async = false;
      document.body.appendChild(s);
    });
  })();
</script>
</body>
</html>
